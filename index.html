<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EDT MMI</title>
  <meta name="description" content="Emploi du temps MMI, synchronisé avec les fichiers ICS publiés.">
  <meta name="theme-color" content="#eef2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EDT">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applique le thème enregistré avant l'affichage, pour éviter un flash de couleur.
    try {
      const theme = JSON.parse(localStorage.getItem('edt:theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (error) {
      // Stockage indisponible : thème automatique.
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" data-app>
    <header class="topbar">
      <h1 class="brand">EDT <span class="brand-group" data-calname></span></h1>
      <div class="topbar-actions">
        <div class="theme-switch" role="group" aria-label="Thème">
          <button type="button" data-theme-choice="auto" aria-pressed="true" aria-label="Thème automatique" title="Automatique">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
          </button>
          <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Thème clair" title="Clair">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Thème sombre" title="Sombre">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button type="button" class="icon-btn" data-refresh aria-label="Actualiser le planning" title="Actualiser">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="group-row">
      <label class="group-label" for="group">Groupe</label>
      <div class="select-wrap">
        <select id="group" class="select" data-group>
          <option value="">Choisir un groupe</option>
        </select>
      </div>
      <button type="button" class="text-btn rooms-btn" data-rooms-open aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4 21h16M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M14 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Salles libres</span>
      </button>
      <p class="status" data-status role="status" aria-live="polite"></p>
    </div>

    <section class="changes" data-changes aria-label="Changements depuis ta dernière visite" hidden></section>

    <section class="now" data-now aria-label="Cours en cours et prochain cours" hidden></section>

    <nav class="toolbar" aria-label="Navigation dans le calendrier">
      <div class="toolbar-nav">
        <button type="button" class="icon-btn" data-nav="-1" aria-label="Période précédente">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="text-btn" data-today>Aujourd’hui</button>
        <button type="button" class="icon-btn" data-nav="1" aria-label="Période suivante">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <h2 class="period" data-period aria-live="polite">Emploi du temps</h2>
      <div class="switch" role="group" aria-label="Affichage">
        <button type="button" data-view="day" aria-pressed="false">Jour</button>
        <button type="button" data-view="week" aria-pressed="true">Semaine</button>
        <button type="button" data-view="month" aria-pressed="false">Mois</button>
      </div>
    </nav>

    <ol class="strip" data-strip aria-label="Jours de la semaine" hidden></ol>

    <main class="calendar" data-calendar></main>
  </div>

  <dialog class="dialog" data-dialog aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title" class="dialog-title" data-dialog-title>Cours</h2>
      <button type="button" class="icon-btn" data-dialog-close aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="dialog-sub" data-dialog-sub></p>
    <dl class="dialog-list" data-dialog-list></dl>
  </dialog>

  <dialog class="dialog rooms-dialog" data-rooms-dialog aria-labelledby="rooms-title">
    <div class="dialog-head">
      <h2 id="rooms-title" class="dialog-title">Salles libres</h2>
      <button type="button" class="icon-btn" data-rooms-close aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="rooms-when">
      <button type="button" class="text-btn rooms-now" data-rooms-now aria-pressed="true">Maintenant</button>
      <label class="rooms-field">
        <span class="visually-hidden">Jour</span>
        <input type="date" class="input" data-rooms-date>
      </label>
      <label class="rooms-field">
        <span class="visually-hidden">Heure</span>
        <input type="time" class="input" data-rooms-time step="300">
      </label>
    </div>
    <p class="rooms-status" data-rooms-status role="status" aria-live="polite"></p>
    <h3 class="rooms-heading" data-rooms-free-title>Libres</h3>
    <ul class="rooms-list" data-rooms-free></ul>
    <h3 class="rooms-heading" data-rooms-busy-title>Occupées</h3>
    <ul class="rooms-list" data-rooms-busy></ul>
    <p class="rooms-note">Basé sur les plannings MMI uniquement : une salle partagée avec un autre département peut être occupée sans que l’app le sache.</p>
  </dialog>

  <noscript><p class="noscript">Cette application a besoin de JavaScript pour afficher l’emploi du temps.</p></noscript>
</body>
</html>
